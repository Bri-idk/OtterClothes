<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuario</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>
  <main>
    <h1>Registro de usuario</h1>

    <form id="formRegistro" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre">
        <span class="error" id="errorNombre"></span>
      </div>

      <div class="campo">
        <label for="telefono">Número de teléfono</label>
        <input type="tel" id="telefono" name="telefono">
        <span class="error" id="errorTelefono"></span>
      </div>

      <div class="campo">
        <label for="email">Email (nombre de usuario)</label>
        <input type="email" id="email" name="email">
        <span class="error" id="errorEmail"></span>
      </div>

      <div class="campo">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion">
        <span class="error" id="errorDireccion"></span>
      </div>

      <!--
      <select class="form-select" id="metodoPago">
        <option value="" selected disabled>Selecciona método de pago principal</option>
        <option value="visa">Visa</option>
        <option value="mastercard">Mastercard</option>
        <option value="amex">American Express</option>
      </select>
      -->

      <div class="campo">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password">
        <span class="error" id="errorPassword"></span>
      </div>

      <div class="campo">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input type="password" id="confirmarPassword" name="confirmarPassword">
        <span class="error" id="errorConfirmar"></span>
      </div>

      <button type="submit">Registrarse</button>
    </form>
  </main>

  <script src="registro.js"></script>
</body>
</html>
