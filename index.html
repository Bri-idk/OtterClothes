  <!-- CARDS DEL INICIO + AGREGAR AL CARRITO -->
  <script>
    (function () {

      // Outfits que se muestran en el inicio (ids de productos.js).
      // 1, 2, 6 = Kpop Idol  |  10, 11, 16 = Casual
      const idsInicio = [1, 10, 2, 11, 6, 16];

      const contenedor = document.getElementById("cardsInicio");


      // ---------- 1. DIBUJAR LAS CARDS ----------

      function crearCard(outfit) {

        const tallasHTML = outfit.tallas
          .map(talla => `
            <button type="button"
                    class="btn btn-outline-dark btn-sm me-1 mb-1 btn-talla-inicio"
                    data-talla="${talla}">${talla}</button>`)
          .join("");

        return `
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="card h-100">
              <img src="${outfit.imagen}" class="card-img-top" alt="${outfit.nombre}">
              <div class="card-body">
                <h5 class="card-title">${outfit.nombre} - ${outfit.categoria}</h5>
                <p class="precio">${outfit.obtenerPrecioFormateado()} MXN</p>
                <p class="card-text">${outfit.descripcionCorta}</p>

                <div class="mb-3">${tallasHTML}</div>

                <button type="button"
                        class="btn btn-comprar btn-agregar-inicio"
                        data-id="${outfit.id}">
                  Agregar al carrito
                </button>
              </div>
            </div>
          </div>`;
      }

      contenedor.innerHTML = idsInicio
        .map(id => outfits.find(outfit => outfit.id === id))
        .filter(Boolean)
        .map(crearCard)
        .join("");


      // ---------- 2. CARRITO ----------

      // Mismo formato que usa la página de outfits: { id, talla, cantidad }
      function guardarEnCarrito(id, talla) {

        let carrito = [];

        try {
          carrito = JSON.parse(localStorage.getItem("otterCarrito")) || [];
        } catch (error) {
          carrito = [];
        }

        const existente = carrito.find(p => p.id === id && p.talla === talla);

        if (existente) {
          existente.cantidad++;
        } else {
          carrito.push({ id, talla, cantidad: 1 });
        }

        localStorage.setItem("otterCarrito", JSON.stringify(carrito));

        // Actualiza el contador del carrito si existe en la página
        const contador = document.getElementById("contadorCarrito");
        if (contador) {
          contador.textContent = carrito.reduce((total, p) => total + p.cantidad, 0);
        }
      }

      // Texto temporal dentro del botón
      function mostrarAviso(boton, texto) {
        if (!boton.dataset.original) boton.dataset.original = boton.innerHTML;
        boton.textContent = texto;
        clearTimeout(boton.temporizador);
        boton.temporizador = setTimeout(() => {
          boton.innerHTML = boton.dataset.original;
        }, 1500);
      }


      // ---------- 3. CLICS (un solo oyente para todas las cards) ----------

      contenedor.addEventListener("click", evento => {

        // Elegir talla
        const botonTalla = evento.target.closest(".btn-talla-inicio");
        if (botonTalla) {
          botonTalla.parentElement.querySelectorAll(".btn-talla-inicio").forEach(b => {
            b.classList.remove("btn-dark", "seleccionada");
            b.classList.add("btn-outline-dark");
          });
          botonTalla.classList.remove("btn-outline-dark");
          botonTalla.classList.add("btn-dark", "seleccionada");
          return;
        }

        // Agregar al carrito
        const botonAgregar = evento.target.closest(".btn-agregar-inicio");
        if (botonAgregar) {
          const tallaElegida = botonAgregar.closest(".card").querySelector(".btn-talla-inicio.seleccionada");

          if (!tallaElegida) {
            mostrarAviso(botonAgregar, "Elige una talla");
            return;
          }

          guardarEnCarrito(Number(botonAgregar.dataset.id), tallaElegida.dataset.talla);
          mostrarAviso(botonAgregar, "¡Agregado!");
          return;
        }
      });

    })();
  </script>
