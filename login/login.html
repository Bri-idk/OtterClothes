<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel = stylesheet href = "CSS/login.css">
    <script src = "JS/login.js" defer></script>

</head>


<body>
<form id="loginForm" novalidate>
    <h1>Iniciar Sesión</h1>

    <label for="usuario">Usuario</label>
    <input type="text" placeholder="Ingrese su usuario" id="usuario">
    <span class="error" id="errorUsuario"></span>

    <label for="clave">Contraseña</label>
    <input type="password" placeholder="Ingrese su contraseña" id="clave">
    <span class="error" id="errorClave"></span>

    <p class="error" id="errorGeneral"></p>

    <input type="submit" value="Entrar">
</form>

  
    
</body>
</html>
