<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--todo: Bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    
    <!--todo: Bootstrap Icons -->
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    
    <!--todo: CSS-->
    <link rel="stylesheet" href="../CSS/styles.css">
    
    <!--todo: Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@500;600&display=swap"
    rel="stylesheet" />

    <title>Búsqueda</title>
</head>
<body class="busqueda">
    <!--todo: Navbar -->
    <div id="navbar-placeholder"></div>

    <!--todo: Container Principal -->
    <div class="container my-4">
        <!--? Título Principal -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-cafe mb-0" style="color: black;">Resultados de búsqueda</h2>
                <p class="text-muted">Mostrando 8 productos para "Hoodies"</p>
            </div> 
        </div>

        <!--todo: Sección de Filtros y Productos -->
        <div class="row">
            <!-- Columna de Filtros -->
            <div class="col-12 col-md-3">
                <div class="card border-0 shadow-sm rounded-4 p-3 mb-4" style="background-color: white;">
                    <h5><strong>Filtros</strong></h5>

                    <!--? 1. Categoría -->
                    <div class="mb-4">
                        <h6 class="fw-bold text-secondary mb-2">Categoría</h6>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="cat-hoodies" checked>
                            <label class="form-check-label d-flex justify-content-between" for="cat-hoodies">
                                <span>Hoodies</span>
                                <span class="text-muted fs-7">(12)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="cat-playeras">
                            <label class="form-check-label d-flex justify-content-between" for="cat-playeras">
                                <span>Playeras</span>
                                <span class="text-muted fs-7">(8)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="cat-sudaderas">
                            <label class="form-check-label d-flex justify-content-between" for="cat-sudaderas">
                                <span>Sudaderas</span>
                                <span class="text-muted fs-7">(5)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="cat-pantalones">
                            <label class="form-check-label d-flex justify-content-between" for="cat-pantalones">
                                <span>Pantalones</span>
                                <span class="text-muted fs-7">(4)</span>
                            </label>
                        </div>
                    </div>

                    <hr class="text-muted opacity-25"> 

                    <!--? 2. Talla -->
                    <div class="mb-4">
                        <h6 class="fw-bold text-secondary mb-2">Talla</h6>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="talla-xs">
                            <label class="form-check-label d-flex justify-content-between" for="talla-xs">
                                <span>XS</span>
                                <span class="text-muted fs-7">(2)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="talla-s">
                            <label class="form-check-label d-flex justify-content-between" for="talla-s">
                                <span>S</span>
                                <span class="text-muted fs-7">(6)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="talla-m">
                            <label class="form-check-label d-flex justify-content-between" for="talla-m">
                                <span>M</span>
                                <span class="text-muted fs-7">(8)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="talla-g">
                            <label class="form-check-label d-flex justify-content-between" for="talla-g">
                                <span>G</span>
                                <span class="text-muted fs-7">(12)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="talla-xl">
                            <label class="form-check-label d-flex justify-content-between" for="talla-xl">
                                <span>XL</span>
                                <span class="text-muted fs-7">(9)</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="talla-xxl">
                            <label class="form-check-label d-flex justify-content-between" for="talla-xxl">
                                <span>XXL</span>
                                <span class="text-muted fs-7">(2)</span>
                            </label>
                        </div>
                    </div>

                    <hr class="text-muted opacity-25">

                    <!--? 3. Color -->
                    <div class="mb-4">
                        <h6 class="fw-bold text-secondary mb-2">Color</h6>
                        <div class="d-flex gap-2 flex-wrap">
                            <button type="button" class="btn p-0 rounded-circle border border-2 border-dark" style="width:24px; height:24px; background-color:#111;"></button>
                            <button type="button" class="btn p-0 rounded-circle border" style="width:24px; height:24px; background-color:#8e8e93;"></button>
                            <button type="button" class="btn p-0 rounded-circle border" style="width:24px; height:24px; background-color:#d1d1d6;"></button>
                            <button type="button" class="btn p-0 rounded-circle border" style="width:24px; height:24px; background-color:#a88beb;"></button>
                            <button type="button" class="btn p-0 rounded-circle border" style="width:24px; height:24px; background-color:#f7a8b8;"></button>
                        </div>
                    </div>

                    <hr class="text-muted opacity-25">

                    <!--? 4. Rango de Precio -->
                    <div class="mb-3">
                        <h6 class="fw-bold text-secondary mb-2">Precio</h6>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="precio-1">
                            <label class="form-check-label d-flex justify-content-between" for="precio-1">
                                <span>$0 - $500</span>
                            </label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="precio-2">
                            <label class="form-check-label d-flex justify-content-between" for="precio-2">
                                <span>$501 - $1,000</span>
                            </label>
                        </div>
                    </div>

                    <!--? Botón de Limpiar -->
                    <div class="d-grid mt-3">
                        <button class="btn btn-outline-success btn-sm rounded-pill" type="button">Limpiar Filtros</button>
                    </div>
                </div>
            </div>

            <!-- Columna de Productos (Aquí colocarás la cuadrícula de productos después) -->
            <div class="col-12 col-md-9">
                <!-- Ejemplo de contenedor para tus productos -->
                <div class="row">
                    <!-- Tus tarjetas de productos irán aquí -->
                </div>
            </div>
        </div>
    </div>

    <!--todo: FOOTER -->
    <footer class="main-footer py-4 text-center mt-auto" style="background-color: #f5e6d3;">
        <div class="container">
            <div class="footer-redes mb-3">
                <a href="https://github.com/Bri-idk/OtterClothes" target="_blank" class="footer-icon"><i class="bi bi-github"></i></a>
            </div>
            <p class="mb-1 fw-bold footer-text">Otterclothes &copy; 2026 - Todos los derechos reservados</p>
            <small class="footer-subtext">Diseñado con <i class="bi bi-heart-fill text-danger"></i> por el equipo de Otter Devs</small>
        </div>
    </footer>
</body>

    <!--todo: Bootstrap JS & Archivo JavaScript personal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js"></script>
</body>
</html>
