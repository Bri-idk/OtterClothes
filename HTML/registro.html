<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/estyleSku.css" />
    <link rel="stylesheet" href="../CSS/registro.css" />
  </head>
  <body class="pagina-registro">
    <div id="navbar-placeholder"></div>
    <main class="sku-page">
      <section class="sku-hero">
        <h1>Registro de usuario</h1>
      </section>

      <div class="container sku-form-container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-10 col-xl-9">
            <section class="sku-panel">
              <div class="sku-panel-heading">
                <div>
                  <h2>Detalles de tu cuenta</h2>
                  <p>Completa tus datos para crear tu cuenta.</p>
                </div>
              </div>

              <form id="formRegistro" novalidate>
                <div class="row">
                  <div class="col-12 col-md-6">
                    <label for="nombre" class="form-label"
                      >Nombre completo</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="nombre"
                      name="nombre"
                    />
                    <span class="error" id="errorNombre"></span>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="telefono" class="form-label"
                      >Número de teléfono</label
                    >
                    <input
                      type="tel"
                      class="form-control"
                      id="telefono"
                      name="telefono"
                    />
                    <span class="error" id="errorTelefono"></span>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="email" class="form-label"
                      >Email (nombre de usuario)</label
                    >
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                    />
                    <span class="error" id="errorEmail"></span>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="direccion" class="form-label">Dirección</label>
                    <input
                      type="text"
                      class="form-control"
                      id="direccion"
                      name="direccion"
                    />
                    <span class="error" id="errorDireccion"></span>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                    />
                    <span class="error" id="errorPassword"></span>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="confirmarPassword" class="form-label"
                      >Confirmar contraseña</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      id="confirmarPassword"
                      name="confirmarPassword"
                    />
                    <span class="error" id="errorConfirmar"></span>
                  </div>
                </div>

                <button
                  class="btn w-100 py-2 fw-bold text-uppercase"
                  type="submit"
                >
                  Crear cuenta
                </button>
              </form>
            </section>
          </div>
        </div>
      </div>
    </main>

    <script src="../JS/registro.js"></script>
    <script src="../JS/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
