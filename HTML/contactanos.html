<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!--CSS-->
    <link rel="stylesheet" href="../CSS/styles.css">  

    <!--Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@500;600&display=swap"
      rel="stylesheet" />

    <title>Contactanos Otters</title>
</head>
<body>
  <!--!Navbar-->
  <div id="navbar-placeholder"></div>

  <h1 id="titulo-contact" class="equipo__heading">Contáctanos</h1>
  <h2 id="subtitulo-contact">¿Tienes comentarios? ¡Déjanos un mensaje!</h2>

  <!--Inicio form-->
  <!--! Imagen del formulario-->
  <div class="contenedor-img-contact" style="display: flex; justify-content: center; ">
      <img src="../assets otterdevs/mockup-anuncio-otter.jpg" alt="mockup-anuncio-otter" width="600" height="300" style="border-radius: 15px;">
  </div>  

  <!--! Contenedor-->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

  <!--! Formulario-->      
  <form id="formContacto">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre">
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="correo" name="correo" placeholder="Correo electrónico">
    </div>

    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono">
    </div>

    <div class="mb-3">
      <label for="mensaje" class="form-label">Mensaje</label>
      <textarea class="form-control" id="mensaje" name="mensaje" rows="3" placeholder="Mensaje"></textarea>
    </div>

    <!--! Botón-->
    <div class="d-grid gap-2 col-6 mx-auto">
      <button id="btn-enviar-contact" class="btn" style="background-color: #49261E" type="submit">Enviar</button>
    </div>
  
    <p id="aviso" class="mt-3"></p> <!--Aqui se despliega información respecto al envío de datos-->
  </form>

    <!--Fin form-->
    <script src = "../JS/navbar.js"></script>
    <script src="../JS/form.js"></script>
</body>
</html>
