<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>Contactanos Otters</title>
</head>
<body>
  <!--navba <div id="navbar-placeholder"></div>r-->
    
    <!--Inicio form-->
    <form id="formContacto">
    <input type="text"   id="nombre"   name="nombre"   placeholder="Nombre">
    <input type="email"  id="correo"   name="correo"   placeholder="Correo eléctrónico">
    <input type="tel"    id="telefono" name="telefono" placeholder="Teléfono">
    <textarea            id="mensaje"  name="mensaje"  placeholder="Mensaje"></textarea>
    <button type="submit">Enviar</button>
    <p id="aviso"></p> <!--Aqui se despliega información respecto al envío de datos-->
    </form>
    <!--Fin form-->
    <script src = "../JS/navbar.js"></script>
