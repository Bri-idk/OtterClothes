<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!--CSS-->
    <link rel="stylesheet" href="../CSS/styles.css">  

    <!--Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@500;600&display=swap"
      rel="stylesheet" />

    <title>Contactanos Otters</title>
</head>
<body>
  <!--!Navbar-->
  <div id="navbar-placeholder"></div>

  <!--! Encabezado-->
  <div class="titulo-contacto">
    <span class="decoracion"></span>
    <h1 id="titulo-contact" class="equipo__heading">Contáctanos</h1>
    <span class="decoracion"></span>
  </div>

  <h2 id="subtitulo-contact">¡Tu voz también forma parte de nuestro estilo!</h2>

  <p class="texto-bienvenida">
    En Otterclothes queremos escucharte. Cuéntanos tus dudas,
    ideas o sugerencias. 💗
  </p>

  <!--Inicio form-->
  <!--! Contenedor-->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

  <!--! Formulario--> 
  <form id="formContacto">
    <div class="mb-3">
      <label for="nombre" class="form-label" style="color: black;">Nombre
        <span class="campo-obligatorio">*</span>
      </label>
      <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre">
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label" style="color: black;">Correo electrónico
        <span class="campo-obligatorio">*</span>
      </label>
      <input type="email" class="form-control" id="correo" name="correo" placeholder="Correo electrónico">
    </div>

    <!--todo: Motivo de contacto-->
    <div class="mb-3">
      <label for="motivo" class="form-label" style="color: black;">Motivo de contacto
        <span class="campo-obligatorio">*</span>
      </label>

      <select
        class="form-select" id="motivo" name="motivo" required>
        <option value="" selected disabled>
          Selecciona una opción
        </option>

        <option value="productos">
          Dudas sobre productos
        </option>

        <option value="pedidos">
          Información sobre pedidos
        </option>

        <option value="devoluciones">
          Cambios y devoluciones
        </option>

        <option value="compra">
          Problemas con mi compra
        </option>

        <option value="sugerencias">
          Sugerencias
        </option>

        <option value="otros">
          Otros
        </option>

      </select>

    </div>
    <!--todo: Fin de motivo de contacto-->
  
    <div class="mb-3">
      <label for="telefono" class="form-label" style="color: black;">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono">
    </div>

    <div class="mb-3">
      <label for="mensaje" class="form-label" style="color: black;">Mensaje</label>
      <textarea class="form-control" id="mensaje" name="mensaje" rows="3" placeholder="Mensaje"></textarea>
    </div>

    <!--! Botón-->
    <div class="d-grid gap-2 col-6 mx-auto">
      <button id="btn-enviar-contact" class="btn" style="background-color: #49261E" type="submit"><i class="bi bi-send"></i>Enviar</button>
    </div>
  
    <p id="aviso" class="mt-3" style="color: #49261E"></p> <!--Aqui se despliega información respecto al envío de datos-->
  </form>

  <!--! Mensaje de confirmación -->
    <section id="confirmacion" class="confirmacion" hidden aria-live="polite">
      <div class="confirmacion__icono">
         🦦💗
      </div>
      <h2>¡Gracias por escribirnos!</h2>
      <p> Tu formulario ha sido enviado correctamente.</p>
      <a href="../index.html" class="btn btn-inicio">Volver al inicio</a>

    </section>

    <!--Fin form-->
    <script src = "../JS/navbar.js"></script>
    <script src="../JS/form.js"></script>
</body>
</html>
