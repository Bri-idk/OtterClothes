<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!--CSS-->
    <link rel="stylesheet" href="../CSS/styles.css">  

    <title>Contactanos Otters</title>
</head>
<body>
  <!--!Navbar-->
  <div id="navbar-placeholder"></div>
  
 <!--! Botones de contáctanos y acerca de nosotros-->
  <div class="d-flex justify-content-center gap-3 my-3">
    <a href="aboutUs.html" target="_blank" class="btn btn-primary" style="background-color: #49261E; font-family: Rugrats Sans;" role="button">
    Acerca de nosotros
    </a>
    <a href="contactanos.html" target="_blank" class="btn btn-primary" style="background-color: #49261E; font-family: Rugrats Sans" role="button">
    Contáctanos
    </a>
  </div>

  <!--Inicio form-->
  <!--! Imagen del formulario-->
  <div style="display: flex; justify-content: center; ">
      <img src="../assets otterdevs/mockup-anuncio-otter.jpg" alt="mockup-anuncio-otter" width="600" height="300" style="border-radius: 15px;">
  </div>  

  <!--! Contenedor-->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

  <!--! Formulario-->      
  <form id="formContacto">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre">
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="correo" name="correo" placeholder="Correo electrónico">
    </div>

    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono">
    </div>

    <div class="mb-3">
      <label for="mensaje" class="form-label">Mensaje</label>
      <textarea class="form-control" id="mensaje" name="mensaje" rows="3" placeholder="Mensaje"></textarea>
    </div>

    <!--! Botón-->
    <div class="d-grid gap-2 col-6 mx-auto">
      <button class="btn btn-primary" style="background-color: #49261E;  font-family: Rugrats Sans" type="button">Enviar</button>
    </div>
  
    <p id="aviso" class="mt-3"></p> <!--Aqui se despliega información respecto al envío de datos-->
  </form>

    <!--Fin form-->
    <script src = "../JS/navbar.js"></script>
    <script src="../JS/form.js"></script>
</body>
</html>
