<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario SKU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estyleSku.css">
  </head>
   <body >
    <button id="btnAbrirFormulario" class="btn-principal">
    ➕ Agregar Nueva Prenda
</button>
<div id="contenedorFormulario" style="display: none;"><!--div del formulario-->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            
            <!-- encabezado administracion -->
            <div class="card p-4 text-center shadow-sm mb-4">
                <h2 class="mb-0 fw-bold">Inventario solo administración.</h2>
            </div>           

            <!-- alerta de exito -->
            <div id="pageSuccessAlert" class="alert alert-success fw-semibold mb-4 d-none" role="alert">
                🎉 ¡Prenda guardada exitosamente!.
            </div>

            <!-- panel del formulario -->
            <div class="card rounded-3 p-4 shadow">
                <h4 class="mb-4 fw-bold">Nuevo Producto de Ropa</h4>
                
                <!-- alertas para errores -->
                <div id="errorAlert" class="alert alert-danger alert-dismissible d-none" role="alert">
                    <strong>¡Error de validación!</strong> <span id="errorMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- formulario -->
                <form id="clothingForm">
                    
                    <!-- Fila: Nombre y Categoría -->
                    <div class="row">
                        <div class="col-12 col-md-6 mb-4">
                            <label for="prodName" class="form-label fw-semibold">Nombre de la Prenda</label>
                            <input type="text" class="form-control" id="prodName" placeholder="Ej: Camisa Slim Fit Lino">
                        </div>
                        <div class="col-12 col-md-6 mb-4">
                            <label for="prodCategory" class="form-label fw-semibold">Categoría</label>
                            <select class="form-select" id="prodCategory">
                                <option value="">Selecciona...</option>
                                <option value="camisas">Camisas / Playeras</option>
                                <option value="pantalones">Pantalones / Jeans</option>
                                <option value="vestidos">Vestidos</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Fila: Género y SKU -->
                    <div class="row">
                        <div class="col-12 col-md-6 mb-4">
                            <label for="prodGender" class="form-label fw-semibold">Género</label>
                            <select class="form-select" id="prodGender">
                                <option value="">Selecciona...</option>
                                <option value="unisex">Unisex</option>
                                <option value="dama">Dama</option>
                                <option value="caballero">Caballero</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6 mb-4">
                            <label for="prodSku" class="form-label fw-semibold">Código SKU</label>
                            <input type="text" class="form-control" id="prodSku" placeholder="Ej: CAM-LINO-01">
                        </div>
                    </div>

                    <!-- Fila: Precios e Inventario -->
                    <div class="row">
                        <div class="col-12 col-md-6 mb-4">
                            <label for="prodPrice" class="form-label fw-semibold">Precio ($)</label>
                            <input type="number" class="form-control" id="prodPrice" placeholder="0.00" step="0.01">
                        </div>
                        <div class="col-12 col-md-6 mb-4">
                            <label for="prodStock" class="form-label fw-semibold">Stock</label>
                            <input type="number" class="form-control" id="prodStock" placeholder="Ej: 50">
                        </div>
                    </div>

                    <!-- Checkboxes: Tallas -->
                    <div class="mb-4">
                        <label class="form-label d-block fw-semibold mb-3">Tallas Disponibles</label>
                        <div class="d-flex flex-wrap gap-4">
                            <div class="form-check">
                                <!-- Clase size-cb reincorporada -->
                                <input class="form-check-input size-cb" type="checkbox" value="S" id="sizeS">
                                <label class="form-check-label" for="sizeS">S</label>
                            </div>
                            <div class="form-check">
                                <!-- Clase size-cb reincorporada -->
                                <input class="form-check-input size-cb" type="checkbox" value="M" id="sizeM">
                                <label class="form-check-label" for="sizeM">M</label>
                            </div>
                            <div class="form-check">
                                <!-- Clase size-cb reincorporada -->
                                <input class="form-check-input size-cb" type="checkbox" value="L" id="sizeL">
                                <label class="form-check-label" for="sizeL">L</label>
                            </div>
                        </div>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="button" class="btn btn-light w-100 py-2 fw-bold text-uppercase" onclick="validarFormulario()">
                        Guardar Producto
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
</div><!--div de l formulario-->
    <script src="scriptSku.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
